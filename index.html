<script>

const EM=[["⛏️","🔋"],["💻","📡"],["🍱","🥐"],["🏖️","🎡"],["🏦","🏢"],["💊","🌿"],["🚚","🏗️"]];
const G=["#傳出重大訂單，市場看好後市。","#財報優於預期，執行長笑說「大家都有鴨幣」。","#新產品爆紅，社群一片好評。"],B=["#生產線出現狀況，出貨恐延遲。","#被爆內部管理混亂，投資人憂心。","#財報不如預期，法說會氣氛凝重。"];
const ETFS=[{k:"ALL",n:"全市場ETF",e:"🦆"},{k:"TECH",n:"科技創新ETF",e:"💡",f:c=>c.s==1},{k:"LIFE",n:"民生消費ETF",e:"🍱",f:c=>c.s==2||c.s==5},{k:"DIV",n:"高股息ETF",e:"💰",dy:.04},{k:"INFRA",n:"礦能基建ETF",e:"⛏️",f:c=>c.s==0||c.s==6},{k:"FUN",n:"旅遊金融ETF",e:"🎈",f:c=>c.s==3||c.s==4},{k:"BOARD",n:"上市大盤ETF",e:"🏛️",f:c=>1},{k:"OTC",n:"上櫃新秀ETF",e:"🌱"},{k:"TOP10",n:"市值前十ETF",e:"👑"}];
const SN="陳林黃張李王吳劉蔡楊",GN=["鴨鴨","茶茶","福福","柴柴","波波","嚕嚕"],HQ=["鴨池市","茶香鎮","雲霧山城","月牙灣","大榕村","彩虹港","星砂島","霧凇谷"];
const BZ=[["原礦開採","儲能電池","地熱與風電","水資源處理","貴金屬精煉"],["雲端服務","半導體設計","機器人","資安軟體","衛星通訊"],["即食麵與罐頭","手搖飲連鎖","寵物食品","紡織服飾","有機農產"],["旅行社","電影院線","遊戲發行","主題樂園","登山露營"],["商業銀行","證券經紀","產險壽險","不動產開發","創業投資"],["新藥研發","連鎖診所","成人教育","長照服務","保健食品"],["航空貨運","海運","冷鏈物流","重型機械","建材"]];
const mc=x=>x>=1e6?(x/1e6).toFixed(2)+'兆':(x/100).toFixed(1)+'億';
function ext(c,r){if(c.sh)return;c.sh=Math.round(50+r()*1450);c.emp=100+(r()*r()*30000|0);c.hq=HQ[r()*8|0];c.ceo=SN[r()*10|0]+GN[r()*6|0];c.ch=SN[r()*10|0]+GN[r()*6|0];c.b1=r()*5|0;c.b2=(c.b1+1+(r()*4|0))%5;c.eps=Math.round(c.p/(8+r()*27)*100)/100;c.hi=Math.max(...c.hs);c.lo=Math.min(...c.hs);c.p0=c.p0||c.hs[0];c.dh=c.dh||[]}
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gauss=r=>Math.sqrt(-2*Math.log(1-r()))*Math.cos(6.2832*r());
const f2=x=>x.toFixed(2),fm=x=>Math.round(x).toLocaleString('zh-TW'),r2=x=>Math.round(x*100)/100,pc=d=>(d>=0?'+':'')+(d*100).toFixed(2)+'%';
let S,D=null;
function mk(id,n,e,s,r){const p=r2(20*Math.exp(r()*2.5)),c={id,n,e,s,p,pc:p,vol:.6+r()*1.1,beta:.6+r()*.8,dy:r()<.25?0:r()*(s==4||s==2?.06:.035),f:[1,2,4][r()*3|0],mo:r()*3|0,yr:1985+(r()*38|0),tr:r()*6|0,hs:[p],hu:r()*360|0,alive:1,imp:0};ext(c,r);return c}
function init(){const r=rng(20270101);S={t:360,acc:0,cash:1e6,hold:{},cs:RAW.split(';').map((x,i)=>{const[n,e,s]=x.split(',');return mk(i,n,e,+s,r)}),ix:1000,ixc:1000,ixh:[1000],etf:{},news:[],log:[],dx:[],sp:[],ah:[],slot:0,sv:2,tk:0,spd:1,tab:'m',last:Date.now()};ETFS.forEach(e=>S.etf[e.k]={v:100,c:100,hs:[100],dh:[]})}
function save(){S.last=Date.now();try{localStorage.setItem('duckmkt1',JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem('duckmkt1');if(s){S=JSON.parse(s);S.dx=S.dx||[];S.sp=S.sp||[];if(S.tab=='e')S.tab='m';if(S.sv!=2){S.slot=0;S.sv=2}S.cs.forEach(c=>ext(c,rng(c.id*131+7)));ETFS.forEach(e=>{const v=S.etf[e.k]||(S.etf[e.k]={v:100,c:100,hs:[100],dh:[]});v.dh=v.dh||[]});return 1}}catch(e){}return 0}
const cons=e=>{const a=S.cs.filter(c=>c.alive),b=a.filter(c=>!c.m);return e.k=="DIV"?b.filter(c=>c.dy>0).sort((x,y)=>y.dy-x.dy).slice(0,10):e.k=="TOP10"?b.slice().sort((x,y)=>y.p*y.sh-x.p*x.sh).slice(0,10):e.k=="ALL"?a:e.k=="OTC"?a.filter(c=>c.m):b.filter(e.f)};
const op=()=>{const m=S.t%1440;return m>=360&&m<1080};
function tstr(t){const d=new Date(START+t*6e4);return`${d.getUTCFullYear()}/${d.getUTCMonth()+1}/${d.getUTCDate()}（${"日一二三四五六"[d.getUTCDay()]}） ${String(d.getUTCHours()).padStart(2,0)}:${String(d.getUTCMinutes()).padStart(2,0)}`}
function info(k){if(k[0]=='c'){const c=S.cs[+k.slice(1)];return{n:c.n,e:c.e,hu:c.hu,p:r2(c.p),pc:r2(c.pc),t:c.id+1001+' '+SEC[c.s][0]+(c.m?'・上櫃':'')+'・市值'+mc(c.p*c.sh),hs:c.hs,dh:c.dh,p0:c.p0,live:c.alive}}const i=ETFS.findIndex(x=>x.k==k.slice(1)),e=ETFS[i],v=S.etf[e.k];return{n:e.n,e:e.e,hu:100+i*40,p:r2(v.v),pc:r2(v.c),t:'ETF '+e.k,hs:v.hs,dh:v.dh,p0:100,live:1}}
const total=()=>Object.keys(S.hold).reduce((a,k)=>a+S.hold[k].q*info(k).p,S.cash);
function addN(h,tag,ts){S.news.unshift({h,tag,ts:ts||Date.now(),g:tstr(S.t)});if(S.news.length>120)S.news.pop()}
function rec(k,s,q,p,f){S.log.unshift({g:tstr(S.t),k,s,q,p,f});if(S.log.length>200)S.log.pop()}
function tick(){const m=2.3e-6+9e-4*gauss(Math.random),sr=SEC.map(()=>6e-4*gauss(Math.random)),rt={};let sum=0,n=0;
for(const c of S.cs){if(!c.alive)continue;const r=c.beta*m+sr[c.s]+c.vol*(c.m?2.6e-3:1.5e-3)*gauss(Math.random)+c.imp*.08;c.imp*=.92;c.p=Math.max(.5,c.p*(1+r));if(c.p>c.hi)c.hi=c.p;if(c.p<c.lo)c.lo=c.p;rt[c.id]=r;if(!c.m){sum+=r;n++}}
if(n)S.ix*=1+sum/n;
for(const e of ETFS){const cs=cons(e);if(!cs.length)continue;let s=0,w=0;for(const c of cs){const m=e.k=='TOP10'?c.p*c.sh:1;s+=rt[c.id]*m;w+=m}S.etf[e.k].v*=1+s/w}
if(++S.tk%12==0){const pu=(a,v)=>{a.push(r2(v));if(a.length>300)a.shift()};S.cs.forEach(c=>c.alive&&pu(c.hs,c.p));pu(S.ixh,S.ix);ETFS.forEach(e=>pu(S.etf[e.k].hs,S.etf[e.k].v))}}
function close(){S.cs.forEach(c=>{c.pc=c.p;if(c.alive){c.dh.push([S.t,r2(c.p)]);if(c.dh.length>400)c.dh.shift()}});ETFS.forEach(e=>{const v=S.etf[e.k];v.c=v.v;v.dh.push([S.t,r2(v.v)]);if(v.dh.length>400)v.dh.shift()});S.ixc=S.ix;S.ah.push([S.t,Math.round(total())]);if(S.ah.length>1000)S.ah.shift()}
function dl(c,k){const f=[0,1.25,1.1][k];ETFS.forEach(e=>{const cs=cons(e);if(cs.includes(c))S.etf[e.k].v*=1+(f-1)/cs.length});if(!c.m)S.ix*=1+(f-1)/S.cs.filter(x=>x.alive&&!x.m).length;
const o=S.hold['c'+c.id];if(o){if(f)S.cash+=o.q*c.p*f;S.dx.unshift({id:c.id,q:o.q,c:o.c,k,v:o.q*c.p*f,g:tstr(S.t)});rec('c'+c.id,'退',o.q,c.p*f,0);delete S.hold['c'+c.id]}c.alive=0;c.dk=k;
addN([`${c.e}${c.n}宣告破產下市，股票歸零。`,`${c.e}${c.n}被大企業收購下市，持股以溢價25%現金收購。`,`${c.e}${c.n}決定私有化下市，持股以溢價10%現金收購。`][k],'公告')}
const IW=[["礦業","能源","電池","地熱","水務"],["科技","軟體","半導體","機器人","雲端"],["食品","飲品","農業","紡織","餐飲"],["旅行社","影業","遊戲","樂園","露營"],["金控","證券","保險","地產","創投"],["生技","診所","教育","照護","保健"],["物流","海運","航運","重工","建材"]],FM=["","","","控股","實業","國際","集團","聯合"],PL=["鴨池","茶香","月牙","大榕","彩虹","星砂","霧凇","雲霧"],PB=["星","月","山","海","雲","風","光","森","霧","晴"];
function nm(s){const R=Math.random,a=P[R()*P.length|0],x=R();return(x<.5?a:x<.8?a+PB[R()*PB.length|0]:PL[R()*PL.length|0]+a)+IW[s][R()*5|0]+FM[R()*FM.length|0]}
const bn=x=>{const a=Math.abs(x);return a>=1e8?(x/1e8).toFixed(2)+'億':a>=1e4?(x/1e4).toFixed(1)+'萬':fm(x)},pe=()=>S.me&&S.me.st==0;
const IV=["黃仁鴨（顯卡大亨）","魏哲鴨（晶圓大亨）","金鴨天使（連續創業家）","鴨爸爸（退休首富）","茶葉天使基金","月光創投"];
const own=()=>{const m=S.me;if(m.id==null)return m.my/m.tot;const c=S.cs[m.id],h=S.hold['c'+m.id];return h?h.q/(c.sh*1e6):0};
function found(){const n=$('#cn').value.trim().slice(0,12),s=+$('#cs').value;if(!n)return ts('請幫公司取個名字');if(S.cs.some(c=>c.n==n))return ts('名稱已被使用');S.me={n,s,e:EM[s][0],hu:Math.random()*360|0,cash:5e6,tot:5e6,my:5e6,inv:[],ck:1e4,eq:0,emp:0,st:0,id:null,lf:5e6};S.of=null;addN(`你創立了${n}，獲贈種子資金 500 萬鴨幣。`,'公司');$('#main').dataset.h='';rm()}
function ck(){S.me.cash+=S.me.ck;rm()}
function eqp(){const m=S.me,c=1e5*2**m.eq;if(m.cash<c)return ts('公司資金不足');m.cash-=c;m.eq++;m.ck+=5e3;rm()}
function hire(){S.me.emp++;rm()}
function fire(){if(S.me.emp>0)S.me.emp--;rm()}
function inv(){const m=S.me;if(m.st!=0)return ts('上櫃後不能再邀請投資人');if(S.of)return ts('已有一份報價待處理');const al=S.cs.filter(c=>c.alive&&!c.me);let n;if(Math.random()<.5)n=IV[Math.random()*IV.length|0];else{const c=al[Math.random()*al.length|0];n=c.ch+'（'+c.n+'董事長）'}
const a=Math.max(1e6,Math.round(m.cash*(.2+Math.random()*.8)/1e4)*1e4),v=m.cash*(.8+Math.random()*1.7);S.of={n,a,v,ns:Math.round(a*m.tot/v)};rm()}
function acc(){const m=S.me,f=S.of;if(!f||m.my/(m.tot+f.ns)<.51)return ts('持股會低於 51%，不能接受');m.cash+=f.a;m.tot+=f.ns;m.inv.push({n:f.n,sh:f.ns,a:f.a});S.of=null;addN(`${f.n}向${m.n}注資 ${bn(f.a)}，取得新股 ${fm(f.ns)} 股。`,'公司');rm()}

const ex=S.cs.find(c=>String(c.id+1001)==q),ee=ETFS.find(e=>e.k==u);if(ex)return row('c'+ex.id);if(ee)return row('e'+ee.k);
const ks=[];S.cs.forEach(c=>{if(String(c.id+1001).startsWith(q)||c.n.includes(q))ks.push('c'+c.id)});ETFS.forEach(e=>{if(e.n.includes(q)||e.k.includes(u))ks.push('e'+e.k)});
return ks.length?ks.slice(0,8).map(k=>row(k)).join('')+(ks.length>8?'<p><small>僅顯示前8筆，請輸入更完整的內容。</small></p>':''):'<p><small>找不到符合的股票。</small></p>'}
function blks(){const al=S.cs.filter(c=>c.alive),mb=al.filter(c=>!c.m),em=['⛏️','💻','🍱','🎡','🏦','💊','🚚'];const B=SEC.map((s,i)=>({k:'s'+i,n:s[0],e:em[i],ks:mb.filter(c=>c.s==i).map(c=>'c'+c.id)}));
B.push({k:'m',n:'上市',e:'🏛️',ks:mb.map(c=>'c'+c.id)},{k:'o',n:'上櫃',e:'🌱',ks:al.filter(c=>c.m).map(c=>'c'+c.id)},{k:'e',n:'ETF',e:'📦',ks:ETFS.map(e=>'e'+e.k)},{k:'d',n:'已下市',e:'🪦',nt:1,ks:S.cs.filter(c=>!c.alive).map(c=>'c'+c.id)});return B}
function bres(){const B=blks();if(!SB)return'<div class="bks">'+B.map(b=>{const n=b.ks.length,d=n&&!b.nt?b.ks.reduce((a,k)=>{const i=info(k);return a+i.p/i.pc-1},0)/n:null;
return`<div class="bk" style="background:${d==null?'var(--c)':d>=0?'rgba(217,48,37,.14)':'rgba(24,128,56,.14)'}" onpointerdown="SB='${b.k}';rm()"><b>${b.e} ${b.n}</b><br><small>${n} 檔</small><br><b class="${d==null?'':d>=0?'u':'d'}">${d==null?'—':pc(d)}</b></div>`}).join('')+'</div>';
const b=B.find(x=>x.k==SB)||B[0],cap=k=>k[0]=='c'?S.cs[+k.slice(1)].p*S.cs[+k.slice(1)].sh:cons(ETFS.find(e=>e.k==k.slice(1))).reduce((a,c)=>a+c.p*c.sh,0);
const sv=k=>{const i=info(k);return SO=='p'?-(i.p/i.pc-1):SO=='m'?-cap(k):(k[0]=='c'?+k.slice(1):1e6+ETFS.findIndex(e=>e.k==k.slice(1)))},ks=b.ks.slice().sort((x,y)=>sv(x)-sv(y));
return`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0"><button class="bb" style="background:var(--ac)" onpointerdown="SB=null;rm()">← 返回</button><b>${b.e} ${b.n}</b><small>${ks.length} 檔</small></div><div class="sp" style="margin-bottom:8px">${[['c','代碼'],['p','漲跌幅'],['m','市值']].map(z=>`<button class="${SO==z[0]?'on':''}" onpointerdown="SO='${z[0]}';rm()">${z[1]}</button>`).join('')}</div>`+(ks.map(k=>row(k)).join('')||'<p><small>這個板塊目前沒有公司。</small></p>')}
function rmM(M){if(M.dataset.h!='M'){M.innerHTML='<div id="ix"></div><div class="sp" id="mt"></div><div id="mq"></div><div id="mr"></div>';M.dataset.h='M';mtb();mqb()}
const d=S.ix/S.ixc-1;$('#ix').innerHTML=`<div class="card"><b>上市大盤指數</b>（不可交易） <b class="${d>=0?'u':'d'}">${f2(S.ix)} ${pc(d)}</b><canvas id="ic"></canvas></div>`;chart($('#ic'),S.ixh.concat(S.ix),d>=0);
const h=MM=='q'?qres():bres(),r=$('#mr');if(r.dataset.h!=h){r.innerHTML=h;r.dataset.h=h}}
function rm(){const T=S.tab,M=$('#main');if(T=='m')return rmM(M);if(T=='c')return rmC(M);let h='',ch=null;
if(T=='m'){const d=S.ix/S.ixc-1;h=`<div class="card"><b>上市大盤指數</b>（不可交易） <b class="${d>=0?'u':'d'}">${f2(S.ix)} ${pc(d)}</b><canvas id="ic"></canvas></div>`+S.cs.filter(c=>c.alive&&!c.m).map(c=>row('c'+c.id)).join('')+(S.cs.some(c=>c.alive&&c.m)?'<p><b>上櫃</b> <small>波動大、下市風險高，有機會升級上市</small></p>'+S.cs.filter(c=>c.alive&&c.m).map(c=>row('c'+c.id)).join(''):'');if(S.cs.some(c=>!c.alive))h+='<p><small>已下市（點擊查看歷史）</small></p>'+dch(1);ch=[S.ixh.concat(S.ix),d>=0]}
else if(T=='h'){const ks=Object.keys(S.hold);h=ks.length?ks.map(k=>{const i=info(k),o=S.hold[k],v=o.q*i.p,pl=v-o.c;return row(k,`${o.q}股・均價${f2(o.c/o.q)}`).replace(/<div class="r">.*?<\/div><\/div>$/,`<div class="r"><b>${fm(v)}</b><small class="${pl>=0?'u':'d'}">${pl>=0?'+':''}${fm(pl)} (${(pl/o.c*100).toFixed(1)}%)</small></div></div>`)}).join(''):'<p><small>還沒有持股，去市場逛逛吧！</small></p>';if(ks.length||pe())h='<div class="card"><b>持股比例（以鴨幣市值計）</b><canvas id="pc" style="height:190px"></canvas><div id="pl"></div></div>'+h;h+=dxh()}
else if(T=='e')h=ETFS.map(e=>row('e'+e.k,`成分股 ${cons(e).length} 檔`)).join('');
else if(T=='n')h=S.news.map(n=>`<div class="card"><small>${n.tag}・${n.g}</small><br>${n.h}</div>`).join('')||'<p><small>目前沒有新聞。</small></p>';
else if(T=='a'){const tv=total();h=`<div class="card"><b>總資產歷史（每日收盤）</b><canvas id="ac"></canvas><small>起始 1,000,000　目前 ${fm(tv)}（${pc(tv/1e6-1)}）</small></div><button onclick="if(confirm('確定重置所有進度？')){localStorage.removeItem('duckmkt1');location.reload()}">重置遊戲</button>`;const a=S.ah.map(x=>x[1]);a.unshift(1e6);a.push(tv);ch=[a,tv>=1e6]}
else h=S.log.map(l=>{const i=info(l.k);return`<div class="card"><small>${l.g}</small><br>${l.s=='息'?'配息':l.s=='退'?'下市結算':l.s=='拆'?'股票分割':l.s=='買'?'買進':'賣出'} <b>${i.n}</b> ${l.q}股 @ ${f2(l.p)}${l.f?`（費用 ${f2(l.f)}）`:''}</div>`}).join('')||'<p><small>還沒有交易紀錄。</small></p>';
if(M.dataset.h!=h){M.innerHTML=h;M.dataset.h=h}
if(ch)chart($('#ic')||$('#ac'),ch[0],ch[1]);if(T=='h')pie()}
function nav(){$('#nav').innerHTML=[["m","市場"],["h","持股"],["c","公司"],["n","新聞"],["a","資產"],["l","紀錄"]].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';nav();$('#main').dataset.h='';rm()">${t[1]}</button>`).join('')}
function spb(){$('#spd').innerHTML=SPD.map(s=>`<button class="${S.spd==s?'on':''}" onclick="S.spd=${s};spb()">${s?s+'×':'⏸'}</button>`).join('')}
function ui(){checkNews();const tv=total(),d=S.ix/S.ixc-1;$('#clk').textContent=tstr(S.t+Math.floor(S.acc))+(op()?' 🟢開盤':' 🔴休市（06:00–18:00交易）');
$('#top').innerHTML=`<div><small>總資產（鴨幣）</small><br><b>${fm(tv)}</b> <small class="${tv>=1e6?'u':'d'}">${tv>=1e6?'+':''}${fm(tv-1e6)}</small></div><div><small>現金</small><br><b>${fm(S.cash)}</b></div><div><small>大盤指數</small><br><b>${f2(S.ix)}</b> <small class="${d>=0?'u':'d'}">${pc(d)}</small></div>`;rm();updD()}
let DR=0;
const kv=a=>a.map(z=>`<div class="kv"><small>${z[0]}</small><b>${z[1]}</b></div>`).join('');
function drb(){$('#dr').innerHTML=['近期','近30日','全部日線'].map((t,j)=>`<button class="${DR==j?'on':''}" onclick="DR=${j};drb();updD()">${t}</button>`).join('')}
function od(k){D=k;DR=0;const i=info(k);let x;
if(k[0]=='c'){const c=S.cs[+k.slice(1)];x=`<div class="kvs">${kv([['市值',mc(c.p*c.sh)],['流通股數',fm(c.sh)+' 百萬股'],['每股盈餘 EPS',f2(c.eps)],['本益比 PE',c.eps>0?(c.p/c.eps).toFixed(1):'—'],['殖利率',c.dy?(c.dy*100).toFixed(1)+'%・'+c.f+'次/年':'不配息'],['歷史最高/最低',f2(c.hi)+' / '+f2(c.lo)],['員工數',fm(c.emp)+' 人'],['總部',c.hq],['董事長',c.ch],['執行長',c.ceo],['上市',c.ld?tstr(c.ld).split('（')[0]:'遊戲開始前'],['波動',c.vol>1.3?'高':c.vol>.9?'中':'低'],['市場',c.m?'上櫃':'上市'],['升級上市',c.up?tstr(c.up).split('（')[0]:'—']])}</div><p>${c.n}是一間虛構的${SEC[c.s][1]}公司，成立於${c.yr}年，總部位於${c.hq}，主要業務為${BZ[c.s][c.b1]}與${BZ[c.s][c.b2]}。${TR[c.tr]}${c.m&&c.alive?'目前於上櫃市場交易，波動與下市風險較高，有機會升級上市。':''}${c.alive?'':'<br><b>此公司已下市（'+(c.dk?'被收購':'破產')+'）。</b>'}</p>`}
else{const e=ETFS.find(z=>z.k==k.slice(1)),cs=cons(e);x=`<div class="kvs">${kv([['成分股數',cs.length+' 檔'],['成分市值合計',mc(cs.reduce((a,c)=>a+c.p*c.sh,0))],['配息',e.dy?'每季一次，年化約4%':'不配息'],['權重',e.k=='TOP10'?'市值加權':'等權重']])}</div><p>${e.n}：${e.k=='DIV'?'追蹤配息最高的10間公司，':''}${e.k=='TOP10'?'追蹤上市公司市值前十大，依市值加權、持續調整。':e.k=='OTC'?'只含上櫃公司，波動大、下市風險高，淨值可能長期下滑。':e.k=='ALL'?'含上市與上櫃公司。':'僅含上市公司。'}公司上市／下市時自動調整成分。</p><p><small>目前成分：${cs.map(c=>c.e+c.n).join('、')}</small></p>`}
$('#modal').hidden=0;$('#modal').innerHTML=`<div class="box"><button class="x" onclick="cl()">✕</button><div style="display:flex;gap:10px;align-items:center">${lg(i.e,i.hu)}<div><b style="font-size:17px">${i.n}</b><br><small>${i.t}</small></div></div><p style="font-size:22px;margin:8px 0 0"><b id="dp"></b> <small id="dc"></small></p><div class="sp" id="dr" style="margin:6px 0"></div><canvas id="dcv"></canvas><div class="kvs" id="pp" style="grid-template-columns:repeat(3,1fr)"></div>${x}<div class="card"><div id="di"></div><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input id="qq" type="number" min="1" value="10"><button class="bb" style="background:#d93025" onclick="bt('${k}',1)">買進</button><button class="bb" style="background:#188038" onclick="bt('${k}',0)">賣出</button><button class="bb" style="background:#667" onclick="sa('${k}')">全部賣出</button></div><small>手續費 0.12%；賣出另收交易稅（個股0.2%／ETF 0.1%）</small></div><p style="margin:10px 0 4px"><b>歷史每日收盤</b></p><div id="dt" style="max-height:200px;overflow:auto"></div></div>`;drb();updD()}
function cl(){D=null;$('#modal').hidden=1}
function updD(){if(!D)return;const i=info(D),d=i.p/i.pc-1,o=S.hold[D],dh=i.dh,z=dh.map(q=>q[1]);
$('#dp').textContent=f2(i.p);$('#dc').textContent=pc(d);$('#dc').className=d>=0?'u':'d';
const a=DR==0?i.hs.slice(-120).concat(i.p):DR==1?z.slice(-30).concat(i.p):z.concat(i.p);chart($('#dcv'),a,a[a.length-1]>=a[0]);
const pp=n=>z.length>=n?pc(i.p/z[z.length-n]-1):'—';
$('#pp').innerHTML=[['近7日',pp(7)],['近30日',pp(30)],['上市以來',pc(i.p/i.p0-1)]].map(q=>`<div class="kv"><small>${q[0]}</small><b class="${q[1][0]=='+'?'u':q[1][0]=='-'?'d':''}">${q[1]}</b></div>`).join('');
const t=$('#dt');if(t.dataset.n!=dh.length){t.dataset.n=dh.length;let h='';for(let j=dh.length-1;j>=Math.max(0,dh.length-30);j--){const c=j?dh[j][1]/dh[j-1][1]-1:null;h+=`<tr><td>${tstr(dh[j][0]).split('（')[0]}</td><td>${f2(dh[j][1])}</td><td class="${c>=0?'u':'d'}">${c==null?'—':pc(c)}</td></tr>`}t.innerHTML=h?`<table>${h}</table>`:'<small>尚無日線資料（每天 18:00 收盤後記錄）</small>'}
$('#di').innerHTML=(i.live?'':'<b>已下市，無法交易</b><br>')+(op()?'🟢 開盤中':'🔴 休市中')+`　現金 ${fm(S.cash)}<br>`+(o?`持有 ${o.q} 股・均價 ${f2(o.c/o.q)}・損益 <b class="${o.q*i.p>=o.c?'u':'d'}">${fm(o.q*i.p-o.c)}</b>`:'尚未持有')}
function sa(k){$('#qq').value=S.hold[k]?S.hold[k].q:0;bt(k,0)}
function bt(k,buy){const i=info(k);if(!i.live)return ts('已下市，無法交易');if(!op())return ts('休市中，每天 06:00–18:00 才能交易');const q=Math.floor(+$('#qq').value);if(!(q>0))return ts('請輸入股數');const p=i.p,etf=k[0]=='e';
if(buy){const g=q*p,fee=Math.max(1,g*FEE);if(g+fee>S.cash)return ts('現金不足');S.cash-=g+fee;const h=S.hold[k]||(S.hold[k]={q:0,c:0});h.q+=q;h.c+=g+fee;rec(k,'買',q,p,fee)}
else{const h=S.hold[k];if(!h||h.q<q)return ts('持股不足');const g=q*p,fee=Math.max(1,g*FEE),tax=g*(etf?.001:.002);S.cash+=g-fee-tax;const b=h.c*q/h.q;h.c-=b;h.q-=q;if(!h.q)delete S.hold[k];rec(k,'賣',q,p,fee+tax)}
rm();$('#top').innerHTML&&ui()}
if(!load())init();catchUp();nav();spb();ui();
let lt=performance.now(),ac=0;
function loop(n){const dt=Math.min((n-lt)/1000,2);lt=n;if(S.spd){S.acc+=dt*S.spd;adv(400)}ac+=dt;if(ac>.8){ac=0;ui()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);setInterval(save,5000);addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>document.hidden?save():(catchUp(),ui()));
</script></body></html>
