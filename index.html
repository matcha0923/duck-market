<script id="dbjs">
/* 存檔層：優先用 IndexedDB（空間大），不支援時退回 localStorage；首次會自動把舊的 localStorage 存檔搬過來 */
window.DB=(function(){
  const ST='kv',D={main:null,lost:null,mode:'idb',size:0,lock:0,err:'',fail:0};
  let db=null,inflight=null,pending=null;
  const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
  const lastOf=t=>{const m=t&&/"last":(\d+)/.exec(t);return m?+m[1]:0};
  const open=()=>new Promise((res,rej)=>{let r;try{r=indexedDB.open('duckmkt',1)}catch(e){return rej(e)}r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))});
  const tx=(m,f)=>new Promise((res,rej)=>{const t=db.transaction(ST,m);let v;const q=f(t.objectStore(ST));if(q)q.onsuccess=()=>{v=q.result};t.oncomplete=()=>res(v);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
  const rawGet=k=>D.mode=='idb'?tx('readonly',o=>o.get(k)).then(v=>v==null?null:v):Promise.resolve(lsGet(k));
  const rawPut=(k,v)=>D.mode=='idb'?tx('readwrite',o=>{o.put(v,k)}):new Promise(res=>{localStorage.setItem(k,v);res()});
  const rawDel=k=>D.mode=='idb'?tx('readwrite',o=>{o.delete(k)}):new Promise(res=>{lsDel(k);res()});
  const ok=async f=>{try{await f();return true}catch(e){D.err=String(e&&e.message||e);return false}};
  D.set=s=>{
    if(D.lock)return Promise.resolve(true);
    pending=s;
    if(!inflight)inflight=(async()=>{let r=true;try{while(pending!=null){const x=pending;pending=null;r=await ok(()=>rawPut('duckmkt1',x));if(r)D.size=x.length}}finally{inflight=null}return r})();
    return inflight;
  };
  D.replace=async s=>{D.lock=1;if(inflight)await inflight;const r=await ok(()=>rawPut('duckmkt1',s));if(r)D.size=s.length;else D.lock=0;return r};
  D.wipe=async()=>{D.lock=1;if(inflight)await inflight;const r=await ok(async()=>{await rawDel('duckmkt1');lsDel('duckmkt1')});if(!r)D.lock=0;return r};
  D.setLost=s=>{D.lost=s;return ok(()=>rawPut('duckmkt1_lost',s))};
  D.clearLost=()=>{D.lost=null;return ok(async()=>{await rawDel('duckmkt1_lost');lsDel('duckmkt1_lost')})};
  D.ready=(async()=>{
    try{db=await open()}catch(e){D.mode='ls';D.err=String(e)}
    try{
      let main=await rawGet('duckmkt1'),lost=await rawGet('duckmkt1_lost');
      if(D.mode=='idb'){
        const om=lsGet('duckmkt1'),ol=lsGet('duckmkt1_lost');
        if(om){
          if(!main||lastOf(om)>lastOf(main)){
            const v=await ok(async()=>{await rawPut('duckmkt1',om);const b=await rawGet('duckmkt1');if(!b||b.length!==om.length)throw new Error('verify')});
            if(v){main=om;lsDel('duckmkt1')}else main=main||om;
          }else lsDel('duckmkt1');
        }
        if(ol){
          if(!lost){if(await ok(()=>rawPut('duckmkt1_lost',ol))){lost=ol;lsDel('duckmkt1_lost')}else lost=ol}
          else lsDel('duckmkt1_lost');
        }
      }
      D.main=main;D.lost=lost;D.size=main?main.length:0;
    }catch(e){D.err=String(e);D.lock=1;D.fail=1}
    return D;
  })();
  return D;
})();
</script>

else{const h=S.hold[k];if(!h||h.q<q)return ts('持股不足');const g=q*pa,fee=Math.max(1,g*FEE*(window.TERR?TERR.fee:1)),tax=g*(etf?.001:.002)*(window.TERR?TERR.tax:1);S.cash+=g-fee-tax;const b=h.c*q/h.q;h.c-=b;h.q-=q;if(!h.q)delete S.hold[k];rec(k,'賣',q,pa,fee+tax)}
if(cc&&fq>0){const f=buy?1+4*fq:Math.max(.3,1-4*fq);cc.p=Math.max(.5,cc.p*f);cc.imp+=(buy?-.5:.5)*Math.abs(f-1)}chkSub();rm();ui()}
if(!load()){try{const raw=DB.main;if(raw){DB.setLost(raw);setTimeout(()=>ts('讀取存檔失敗，舊存檔已另存備份（重新整理後可選擇還原）'),800)}}catch(e){}init()}try{const q=localStorage.getItem('duckmkt_pn');if(q&&(!S.pa||!S.pn)){S.pn=q;S.pa=1}}catch(e){}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}if(!S.pn)S.pn='玩家'+String(1+Math.random()*999|0).padStart(3,'0');if(!S.pid)S.pid='p'+Math.random().toString(36).slice(2)+Date.now().toString(36);try{const q=localStorage.getItem('duckmkt_pid');if(q)S.pid=q;else localStorage.setItem('duckmkt_pid',S.pid)}catch(e){}

try{catchUp()}catch(err){console.error('離線進度更新失敗：',err);S.spd=0;renderSpeed();ts('進度更新遇到錯誤，遊戲已暫停；其他頁面仍可操作。')}
let lt=performance.now(),ac=0;
function loop(n){
 try{
  const dt=Math.min((n-lt)/1000,2);lt=n;
  if(S.spd){S.acc+=dt*S.spd;adv(400)}
  ac+=dt;if(ac>.8){ac=0;ui()}
 }catch(err){
  console.error('遊戲更新錯誤：',err);S.spd=0;try{renderSpeed();ts('遊戲更新遇到錯誤，已自動暫停；請先切換頁面或重新載入。')}catch(_){ }
 }finally{requestAnimationFrame(loop)}
}
requestAnimationFrame(loop);setInterval(save,5000);addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{try{catchUp();ui()}catch(err){console.error(err);S.spd=0;renderSpeed()}}});
